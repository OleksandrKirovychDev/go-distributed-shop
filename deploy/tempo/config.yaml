# Monolithic mode (default target=all): distributor pushes traces in-process to
# the live-store and compaction runs in-process, so the 2.x `ingester` and
# `compactor` blocks (removed in Tempo 3.0) are gone and no Kafka is required.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

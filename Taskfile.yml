version: "3"

silent: true

vars:
  MODULES:
    sh: find "{{.TASKFILE_DIR}}" -name go.mod -not -path '*/.git/*' -exec dirname {} \;

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # --- Code quality -------------------------------------------------------

  lint:
    desc: Run golangci-lint across every workspace module
    cmds:
      - for: { var: MODULES }
        cmd: (cd "{{.ITEM}}" && golangci-lint run ./...)

  fmt:
    desc: Format Go code across the workspace (gofmt + goimports)
    cmds:
      - gofmt -w .
      - goimports -w -local github.com/online-shop .

  test:
    desc: Run unit + adapter tests for every workspace module
    cmds:
      - for: { var: MODULES }
        cmd: (cd "{{.ITEM}}" && go test ./...)

  test:integration:
    desc: Run E2E smoke tests against the running stack
    cmds:
      - echo "Not implemented yet."

  # --- Proto / gRPC -------------------------------------------------------

  proto:gen:
    desc: Generate Go code from .proto definitions
    cmds:
      - buf generate

  proto:lint:
    desc: Lint .proto definitions
    cmds:
      - buf lint

  proto:breaking:
    desc: Detect breaking changes in protos against the main branch
    cmds:
      - buf breaking --against '.git#branch=main'

  # --- Local infrastructure ----------------------------------------------

  infra:up:
    desc: Start local infrastructure (Postgres, Redpanda, Redis, OpenSearch, MinIO, LGTM stack)
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: Stop local infrastructure (data volumes persist)
    cmds:
      - docker compose down

  infra:down:hard:
    desc: Stop local infrastructure and delete all data volumes
    cmds:
      - docker compose down -v

  infra:logs:
    desc: Follow logs from all infrastructure containers
    cmds:
      - docker compose logs -f

  infra:ps:
    desc: Show status of infrastructure containers
    cmds:
      - docker compose ps

  up:
    desc: Bring up the entire stack (infra + services)
    cmds:
      - echo "Not implemented yet."

  down:
    desc: Tear down the entire stack
    cmds:
      - echo "Not implemented yet."

  # --- GraphQL federation ------------------------------------------------

  supergraph:compose:
    desc: Compose Apollo Federation v2 supergraph from subgraph schemas
    cmds:
      - echo "Not implemented yet."

  supergraph:check:
    desc: Verify the committed supergraph.graphql matches a fresh recomposition
    cmds:
      - echo "Not implemented yet."

  # --- Git hooks ----------------------------------------------------------

  hooks:install:
    desc: Install lefthook git hooks into .git/hooks (idempotent)
    cmds:
      - lefthook install

  hooks:run:
    desc: Run all lefthook checks against the full tree
    cmds:
      - lefthook run pre-commit --all-files

  # --- Smoketest -------------------------------

  smoketest:run:
    desc: Run the proof-of-life cmd (one JSON log line + one OTel span)
    dir: cmd/smoketest
    cmds:
      - go run .

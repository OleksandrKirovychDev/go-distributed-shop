root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/identity ./cmd/identity"
  bin = "./tmp/identity"
  include_ext = ["go"]
  include_dir = ["internal", "cmd"]
  exclude_dir = ["tmp", "gen", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true

[misc]
  clean_on_exit = true
